name: Scheduled crypto news ingestion

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-news-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger production news ingestion
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET" || { echo "Configure the CRON_SECRET repository Actions secret."; exit 1; }
          curl --fail-with-body --silent --show-error --max-time 55 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://cryptohub.vercel.app/api/cron/news-ingest"
