# SmartExit / ETHcryptohub — Render Blueprint Specification (Infrastructure as Code)
# Documentation: https://render.com/docs/blueprint-spec
version: "1"

services:
  # ---------------------------------------------------------------------------
  # 1. SmartExit Staging Web Service (Next.js Application)
  # ---------------------------------------------------------------------------
  - type: web
    name: smartexit-staging
    runtime: node
    plan: free
    region: singapore
    branch: functional-staging
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    autoDeploy: false
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SMARTEXIT_DEPLOYMENT_ENV
        value: staging
      - key: TRADING_ENVIRONMENT
        value: DEMO
      - key: SMARTEXIT_TRADING_ENVIRONMENT
        value: DEMO
      - key: WORKER_SAFE_MODE
        value: "true"
      - key: DEMO_ORDER_DISPATCH_ENABLED
        value: "false"
      - key: DISABLE_BACKGROUND_SCANNER
        value: "true"
      - key: SMARTEXIT_FORCE_BACKEND_PROXY
        value: "true"
      - key: SMARTEXIT_BACKEND_URL
        value: https://site--smartexit-staging--bg8tkg2xcxv8.code.run
      - key: BINANCE_FUTURES_LIVE_TRADING_APPROVED
        value: "false"
      - key: BINANCE_FUTURES_LIVE_TRADING_ENABLED
        value: "false"
      - key: SMARTEXIT_CRON_RECONCILIATION_ENABLED
        value: "false"
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://ghecpkpaxbrvehquhzkr.supabase.co
      - key: SMARTEXIT_STAGING_SUPABASE_PROJECT_REF
        value: ghecpkpaxbrvehquhzkr
      - key: SMARTEXIT_PRODUCTION_SUPABASE_PROJECT_REF
        value: kafsdnzzjawikoavkhvm
      - key: SUPABASE_DB_HOST
        value: aws-0-ap-southeast-2.pooler.supabase.com
      - key: SUPABASE_DB_PORT
        value: "6543"
      - key: SUPABASE_DB_NAME
        value: postgres
      - key: SUPABASE_DB_USER
        value: postgres.ghecpkpaxbrvehquhzkr
      - key: SUPABASE_DB_SSLMODE
        value: verify-full
      # Sensitive secrets configured securely in Render dashboard
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: BINANCE_CREDENTIALS_KEY
        sync: false
      - key: SMARTEXIT_PRODUCTION_BINANCE_CREDENTIALS_KEY_SHA256
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: WORKER_SECRET
        sync: false
      - key: APP_URL
        sync: false
